name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: infra_db
          POSTGRES_USER: infra_user
          # Throwaway database that only exists for the length of this CI run
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infra_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only values; real deployments set their own in .env
      DJANGO_SECRET_KEY: ci-only-secret-key-used-for-tests-and-nothing-else-0123456789
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: infra_db
      DB_USER: infra_user
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test tests --noinput

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
